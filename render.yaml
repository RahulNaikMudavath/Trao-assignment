services:
  # 1. Backend Express API Web Service
  - type: web
    name: trao-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Next.js Web Service
  - type: web
    name: trao-frontend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
