services:
  - type: web
    name: trao-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
